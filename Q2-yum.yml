---
- name: Q2 - Playbook to setup repository
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: Task-1 install gpg-key
      ansible.builtin.rpm_key:
        key: http://10.10.1.200/alma10/RPM-GPG-KEY-AlmaLinux-10
        state: present
    - name: Task-2 Configuring Base Repo
      ansible.builtin.yum_repository:
        file: ex294_repo.repo
        state: present
        name: EX294_BASE
        description: EX294 base software
        enabled: true
        baseurl: http://10.10.1.200/alma10/BaseOS
        gpgcheck: true
        gpgkey: http://10.10.1.200/alma10/RPM-GPG-KEY-AlmaLinux-10

    - name: Task-3 Configuring AppStream Repo
      ansible.builtin.yum_repository:
        file: ex294_repo.repo
        state: present
        name: EX294_STREAM
        description: EX294 appstream software
        enabled: true
        baseurl: http://10.10.1.200/alma10/AppStream
        gpgcheck: true
        gpgkey: http://10.10.1.200/alma10/RPM-GPG-KEY-AlmaLinux-10
